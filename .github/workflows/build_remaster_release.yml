name: build-remaster-v2

# Builds ONLY the kkrieger player in Release, on a GitHub Windows runner.
# No Visual Studio install is needed on the player's PC.
# Trigger: push to the remaster-v2 branch (or manual dispatch).
# v2 = v1 (1080p + double-size textures) + 4x MSAA (with 2x/none fallback).
on:
  push:
    branches: ["remaster-v2"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply remaster v1+v2 patches (verified)
        shell: powershell
        run: |
          $start = 'werkkzeug3_kkrieger/_start.cpp'
          $main = 'werkkzeug3_kkrieger/player_kkrieger/kkrieger_main.cpp'
          $s = Get-Content -Raw $start
          if (-not $s.Contains('#define sPLAYER_SCREENX     800')) { throw 'expected 800 line not found in _start.cpp' }
          $s = $s.Replace('#define sPLAYER_SCREENX     800', '#define sPLAYER_SCREENX     1920')
          $s = $s.Replace('#define sPLAYER_SCREENY     600', '#define sPLAYER_SCREENY     1080')
          Set-Content $start $s
          $m = Get-Content -Raw $main
          if (-not $m.Contains('//GenBitmapTextureSizeOffset = -1;')) { throw 'expected texture line not found in kkrieger_main.cpp' }
          $m = $m.Replace('//GenBitmapTextureSizeOffset = -1;', 'GenBitmapTextureSizeOffset = 1;')
          Set-Content $main $m
          Select-String -Path $start -Pattern 'sPLAYER_SCREENX     1920'
          Select-String -Path $main -Pattern 'GenBitmapTextureSizeOffset = 1;'
          # Release link lists dinput.lib, which no longer exists in the Windows SDK
          # (DirectInput is dinput8.lib, which the code itself already uses via
          # #pragma comment and DirectInput8Create). Debug builds never hit this
          # because Debug has no AdditionalDependencies at all.
          $proj = 'werkkzeug3_kkrieger/player_kkrieger/player_kkrieger.vcxproj'
          $p = Get-Content -Raw $proj
          if (-not $p.Contains('dinput.lib')) { throw 'expected dinput.lib not found in player vcxproj' }
          $p = $p.Replace('dinput.lib', 'dinput8.lib')
          # Release uses /nodefaultlib (custom WinMainCRTStartup, size-optimized
          # original), so the CRT/math/RTTI helpers the compiler now emits as
          # calls (memcpy, memset, __libm_sse2_*, __CIatan2, type_info) are
          # unresolved. Link them explicitly; size no longer matters for v1.
          $p = $p.Replace('winmm.lib;dxguid.lib;dinput8.lib;', 'winmm.lib;dxguid.lib;dinput8.lib;libcmt.lib;libvcruntime.lib;libucrt.lib;libcpmt.lib;oldnames.lib;')
          Set-Content $proj $p
          Select-String -Path $proj -Pattern 'dinput8.lib'
          Select-String -Path $proj -Pattern 'libcmt.lib'
          # With libcmt linked, the linker pulls CRT startup, which needs WinMain.
          # Release/intro code defines WinMainCRTStartup instead, but in C++ it
          # is name-mangled, so the linker cannot see it as the entry point.
          # Make it extern "C" so it IS the entry point and CRT startup is
          # never pulled in.
          $sc = Get-Content -Raw $start
          if (-not $sc.Contains('void WinMainCRTStartup()')) { throw 'expected WinMainCRTStartup not found in _start.cpp' }
          $sc = $sc.Replace('void WinMainCRTStartup()', 'extern "C" void WinMainCRTStartup()')
          Set-Content $start $sc
          Select-String -Path $start -Pattern 'extern "C" void WinMainCRTStartup'
          # v2 MSAA: the player (intro) InitScreens builds D3DPRESENT_PARAMETERS
          # with WINZERO, so MultiSampleType is NONE. Set 4x MSAA, checked
          # against BOTH the backbuffer format and the D24S8 depth format,
          # falling back to 2x, then none, so an unsupported GPU still starts.
          # The intro depth surface must use the same multisample type as the
          # backbuffer, or D3D9 rejects it.
          $sc = Get-Content -Raw $start
          $msAnchor = '  d3dpp.Flags = 0;'
          if (-not $sc.Contains($msAnchor)) { throw 'expected d3dpp.Flags anchor not found in _start.cpp' }
          $msLines = @(
            '  d3dpp.Flags = 0;',
            '  {',
            '    DWORD msQuality = 0;',
            '    BOOL msWindowed = (IntroFlags & sSF_FULLSCREEN) ? FALSE : TRUE;',
            '    if (SUCCEEDED(DXD->CheckDeviceMultiSampleType(0, D3DDEVTYPE_HAL, (D3DFORMAT) Screen[0].SFormat, msWindowed, D3DMULTISAMPLE_4_SAMPLES, &msQuality)) && SUCCEEDED(DXD->CheckDeviceMultiSampleType(0, D3DDEVTYPE_HAL, (D3DFORMAT) ZBufFormat, msWindowed, D3DMULTISAMPLE_4_SAMPLES, &msQuality)))',
            '    {',
            '      d3dpp.MultiSampleType = D3DMULTISAMPLE_4_SAMPLES;',
            '      d3dpp.MultiSampleQuality = 0;',
            '    }',
            '    else if (SUCCEEDED(DXD->CheckDeviceMultiSampleType(0, D3DDEVTYPE_HAL, (D3DFORMAT) Screen[0].SFormat, msWindowed, D3DMULTISAMPLE_2_SAMPLES, &msQuality)) && SUCCEEDED(DXD->CheckDeviceMultiSampleType(0, D3DDEVTYPE_HAL, (D3DFORMAT) ZBufFormat, msWindowed, D3DMULTISAMPLE_2_SAMPLES, &msQuality)))',
            '    {',
            '      d3dpp.MultiSampleType = D3DMULTISAMPLE_2_SAMPLES;',
            '      d3dpp.MultiSampleQuality = 0;',
            '    }',
            '  }'
          )
          $msCode = $msLines -join "`r`n"
          $idx = $sc.IndexOf($msAnchor)
          $sc = $sc.Substring(0, $idx) + $msCode + $sc.Substring($idx + $msAnchor.Length)
          $depthAnchor = 'CreateDepthStencilSurface(zBufX,zBufY,(D3DFORMAT) ZBufFormat,D3DMULTISAMPLE_NONE,0,FALSE,&ZBuffer,0)'
          if (-not $sc.Contains($depthAnchor)) { throw 'expected intro depth-surface line not found in _start.cpp' }
          $sc = $sc.Replace($depthAnchor, 'CreateDepthStencilSurface(zBufX,zBufY,(D3DFORMAT) ZBufFormat,d3dpp.MultiSampleType,d3dpp.MultiSampleQuality,FALSE,&ZBuffer,0)')
          Set-Content $start $sc
          Select-String -Path $start -Pattern 'D3DMULTISAMPLE_4_SAMPLES'
          Select-String -Path $start -Pattern 'd3dpp.MultiSampleType,d3dpp.MultiSampleQuality'

      - name: Install yasm
        run: choco install yasm -y
        shell: powershell

      - name: Build player (Release, Win32)
        # The project force-includes $(SolutionDir)/player_kkrieger/kkrieger_config.hpp.
        # Building a .vcxproj alone leaves SolutionDir pointing at the project folder,
        # which doubles the path and fails with C1083. Point it at the solution folder.
        run: msbuild 'werkkzeug3_kkrieger/player_kkrieger/player_kkrieger.vcxproj' /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$env:GITHUB_WORKSPACE/werkkzeug3_kkrieger/"

      - name: Package run-only build
        shell: powershell
        run: |
          $exe = 'werkkzeug3_kkrieger/player_kkrieger/Release/player_kkrieger.exe'
          if (-not (Test-Path $exe)) { throw "player exe not found at $exe" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe 'dist/player_kkrieger.exe'
          Copy-Item 'werkkzeug3_kkrieger/data/kkrieger3383.kx' 'dist/kkrieger3383.kx'
          Copy-Item 'run_dist.bat' 'dist/run.bat'
          Compress-Archive -Path dist/* -DestinationPath kkrieger-remaster-v2-run.zip -Force
          Get-ChildItem dist, kkrieger-remaster-v2-run.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kkrieger-remaster-v2-run
          path: kkrieger-remaster-v2-run.zip

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="remaster-v2-${{ github.run_number }}"
          gh release create "$TAG" --title "kkrieger remaster v2 (1080p + MSAA) - build $TAG" --notes "Remaster v2: v1 (1920x1080 fullscreen + procedural textures at double size) + 4x MSAA with 2x/none fallback. Run-only: unzip and double-click run.bat. No Visual Studio needed." kkrieger-remaster-v2-run.zip
